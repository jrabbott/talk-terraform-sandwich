<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-label="Terraform Sandwich CI pipeline">
  <defs>
    <style>
      .label { font-family: Atkinson Hyperlegible, Helvetica Neue, Helvetica, Arial, sans-serif; fill: #121820; }
      .muted { fill: #2c3544; }
      .step { fill: #faf8f4; stroke: #121820; stroke-width: 3; }
      .accent { fill: #0c6b52; }
      .on { fill: #f2eee6; }
      .arrow { stroke: #0c6b52; stroke-width: 4; fill: none; marker-end: url(#arrowHead); }
      .dash { stroke: #2c3544; stroke-width: 3; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrowMuted); }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0c6b52"/>
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2c3544"/>
    </marker>
  </defs>

  <!-- Build -->
  <polygon points="120,180 200,120 280,180 200,240" class="step"/>
  <text x="200" y="175" text-anchor="middle" class="label" font-size="20" font-weight="700">Build</text>
  <text x="200" y="200" text-anchor="middle" class="label" font-size="18" font-weight="700">artifact</text>

  <path d="M290 180 H360" class="arrow"/>

  <!-- Terraform 1 -->
  <rect x="370" y="120" width="220" height="120" rx="18" class="step"/>
  <text x="480" y="175" text-anchor="middle" class="label" font-size="24" font-weight="700">Terraform 1</text>
  <text x="480" y="210" text-anchor="middle" class="muted" font-size="18">infra minus EG</text>

  <path d="M600 180 H670" class="arrow"/>

  <!-- Release -->
  <circle cx="750" cy="180" r="70" class="accent"/>
  <text x="750" y="175" text-anchor="middle" class="on" font-size="22" font-weight="700">Release</text>
  <text x="750" y="205" text-anchor="middle" class="on" font-size="20">software</text>

  <path d="M830 180 H900" class="arrow"/>

  <!-- Terraform 2 -->
  <rect x="910" y="120" width="220" height="120" rx="18" class="step"/>
  <text x="1020" y="175" text-anchor="middle" class="label" font-size="24" font-weight="700">Terraform 2</text>
  <text x="1020" y="210" text-anchor="middle" class="muted" font-size="18">subscriptions</text>

  <path d="M1140 180 H1210" class="arrow"/>

  <!-- Last steps -->
  <polygon points="1220,180 1280,120 1400,120 1460,180 1400,240 1280,240" class="step"/>
  <text x="1340" y="175" text-anchor="middle" class="label" font-size="22" font-weight="700">Last-step</text>
  <text x="1340" y="205" text-anchor="middle" class="label" font-size="22" font-weight="700">scripts</text>

  <!-- Admin scripts branch -->
  <path d="M1020 250 V360 H1340" class="dash"/>
  <rect x="1220" y="380" width="240" height="80" rx="12" class="step"/>
  <text x="1340" y="430" text-anchor="middle" class="label" font-size="22" font-weight="700">Admin scripts</text>

  <text x="750" y="470" text-anchor="middle" class="muted" font-size="22">
    App must be running before Event Grid subscriptions can be created
  </text>
</svg>
