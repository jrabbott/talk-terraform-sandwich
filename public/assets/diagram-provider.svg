<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-label="Terraform talks to a provider which calls the target API">
  <defs>
    <style>
      .label { font-family: Atkinson Hyperlegible, Helvetica Neue, Helvetica, Arial, sans-serif; fill: #121820; }
      .muted { fill: #2c3544; }
      .box { fill: #c5e4d8; stroke: #0c6b52; stroke-width: 3; }
      .soft { fill: #faf8f4; stroke: #121820; stroke-width: 3; }
      .arrow { stroke: #0c6b52; stroke-width: 4; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0c6b52"/>
    </marker>
  </defs>

  <rect x="40" y="140" width="320" height="240" rx="16" class="box"/>
  <text x="200" y="250" text-anchor="middle" class="label" font-size="36" font-weight="700">Terraform</text>
  <text x="200" y="295" text-anchor="middle" class="label muted" font-size="22">configuration + state</text>

  <path d="M380 260 H470" class="arrow"/>

  <rect x="490" y="140" width="420" height="240" rx="16" class="soft"/>
  <text x="700" y="235" text-anchor="middle" class="label" font-size="28" font-weight="700">Provider</text>
  <text x="700" y="280" text-anchor="middle" class="label muted" font-size="22">translates desired state</text>
  <text x="700" y="315" text-anchor="middle" class="label muted" font-size="22">into API calls</text>

  <path d="M930 260 H1020" class="arrow"/>

  <rect x="1040" y="140" width="320" height="240" rx="16" class="box"/>
  <ellipse cx="1200" cy="230" rx="78" ry="42" fill="#0c6b52" opacity="0.2"/>
  <ellipse cx="1200" cy="230" rx="54" ry="28" fill="#0c6b52" opacity="0.35"/>
  <text x="1200" y="310" text-anchor="middle" class="label" font-size="28" font-weight="700">Target API</text>
  <text x="1200" y="345" text-anchor="middle" class="label muted" font-size="20">cloud / SaaS</text>
</svg>
